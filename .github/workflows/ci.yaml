name: CI (macOS Build)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cleaning Mode policy tests
        run: ./Tests/run-tests.sh

      - name: Build (Debug, no signing)
        run: |
          xcodebuild \
            -project Vigil.xcodeproj \
            -scheme Vigil \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app (Debug)
        run: |
          APP_PATH="build/Build/Products/Debug/Vigil.app"
          ZIP_NAME="Vigil-Debug.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          ls -la "$ZIP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vigil-Debug
          path: Vigil-Debug.zip
          retention-days: 14
