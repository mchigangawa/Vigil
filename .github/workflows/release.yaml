name: Release (macOS)

# Tagging and releasing live in ONE workflow on purpose.
#
# Split across two, the tag has to be pushed with a personal access token,
# because a tag pushed using the default GITHUB_TOKEN does not trigger other
# workflows. Doing both here means the default token is sufficient and no
# long-lived credential needs to be stored in the repository.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read MARKETING_VERSION
        id: ver
        run: |
          VERSION=$(/usr/bin/xcodebuild -showBuildSettings \
            -project Vigil.xcodeproj \
            -scheme Vigil | \
            awk -F ' = ' '/MARKETING_VERSION/ {print $2; exit}')

          if [ -z "$VERSION" ]; then
            echo "MARKETING_VERSION not found."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Has this version already been released?
        id: check
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. Nothing to release."
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "$TAG is new. Releasing."
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Tests
        if: steps.check.outputs.needed == 'true'
        run: ./Tests/run-tests.sh

      - name: Build (Release, no signing)
        if: steps.check.outputs.needed == 'true'
        run: |
          xcodebuild \
            -project Vigil.xcodeproj \
            -scheme Vigil \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app
        if: steps.check.outputs.needed == 'true'
        run: |
          APP_PATH="build/Build/Products/Release/Vigil.app"
          ZIP_NAME="Vigil-${{ steps.ver.outputs.tag }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          ls -la "$ZIP_NAME"

      # Tag only once the build has actually succeeded, so a failed build
      # never leaves a tag behind that blocks the next attempt.
      - name: Tag
        if: steps.check.outputs.needed == 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Vigil ${{ steps.ver.outputs.version }}"
          git push origin "$TAG"

      - name: Create GitHub Release and upload asset
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "Vigil ${{ steps.ver.outputs.tag }}" \
            --notes "See CHANGELOG.md for full details." \
            --generate-notes \
            "$ZIP_NAME"
